version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: cjei_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cjei
      POSTGRES_PASSWORD: cjei
      POSTGRES_DB: cjei_recommendations
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cjei -d cjei_recommendations"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cjei_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application
      PROJECT_NAME: "CJEI Board Game Recommendation System"
      VERSION: "1.0.0"
      API_PREFIX: "/api"
      
      # Database - uses the db service
      DATABASE_URL: postgresql://cjei:cjei@db:5432/cjei_recommendations
      
      # Security (CHANGE IN PRODUCTION!)
      SECRET_KEY: "development-secret-key-change-in-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      
      # Pagination
      DEFAULT_PAGE_SIZE: 20
      MAX_PAGE_SIZE: 100
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for development (hot reload)
      - ./backend:/app
      # Don't override these
      - /app/__pycache__
      - /app/.pytest_cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    name: cjei_postgres_data
